name: CI and environment validation
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python tests and repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: node --check web/app.js
      - run: node --check web/workspace.js
      - run: node scripts/test_workspace.js
      - run: python scripts/check_repository.py
      - run: python -m unittest discover -s tests -v
      - run: python -m clinical_trial.synthetic_study "$RUNNER_TEMP/synthetic-controls.json"
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python scripts/smoke_runtime.py
      - run: python scripts/check_concurrent_runtime.py
      - run: python -m compileall -q clinical_trial scripts tests
      - run: python scripts/release_manifest.py > "$RUNNER_TEMP/release-manifest.json"

  delivery:
    name: Browser, container and Bicep verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser
      - run: docker build -t triallens:ci .
      - run: python scripts/smoke_container.py
      - run: az bicep install
      - run: az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/infra.json"

  environments:
    name: Validate ${{ matrix.environment }} (no Azure deployment)
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: [ENG, TEST, PROD]
    environment:
      name: ${{ matrix.environment }}
    env:
      APP_ENV: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m clinical_trial
